<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bread Scheduler</title>
    <link rel="stylesheet" href="styles/main.scss" />
  </head>
  <body>
    <header>
      <h1>Bread Scheduler</h1>
      <p>
        Pick when the bread comes out of the oven, and see when to start each
        step.
      </p>
    </header>

    <main>
      <section aria-labelledby="recipeName">
        <h2 id="recipeName"></h2>
        <label for="end">Out of the oven</label>
        <input id="end" type="datetime-local" />
        <p>
          Start times use the target for each step. The window is the earliest
          and latest you can start a step and still come out of the oven on
          time.
        </p>
        <!-- The table below carries the same information for screen readers. -->
        <div id="timeline" class="timeline" aria-hidden="true"></div>
        <table>
          <thead>
            <tr>
              <th scope="col">Step</th>
              <th scope="col">Start</th>
              <th scope="col">Window</th>
            </tr>
          </thead>
          <tbody id="steps"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="scripts/app.ts"></script>
  </body>
</html>
